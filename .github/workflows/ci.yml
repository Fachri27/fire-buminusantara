name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Dipanggil release.yml untuk push langsung ke main — tanpa ini commit yang
  # menyingkir alur PR sampai produksi tanpa diuji.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Satu runner, satu `npm ci`. Urutan gerbang disengaja dari yang termurah:
  # rahasia → lint → tsc (tipe jebol = 500 di produksi) → unit test → DB →
  # build. Pemisahan per job dulu hanya menggandakan npm ci tanpa manfaat.
  test:
    runs-on: ubuntu-latest
    # Gerbang yang tidak bisa dilihat tsc: payload Prisma vs skema DB SUNGGUHAN.
    # Insiden image_en (Verifikasi gagal berhari-hari) lolos tsc + unit test;
    # di sini ia gagal. MariaDB = mesin yang sama dengan produksi.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      # --no-git: pindai pohon kerja, bukan riwayat — menangkap rahasia yang
      # sedang ditambahkan tanpa menggagalkan PR karena commit purba.
      # --redact: jangan pernah cetak rahasia ke log. Versi dipatok.
      - name: Pindai kebocoran rahasia (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-git --redact --verbose --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      # WAJIB sebelum tsc: `PageProps`, `LayoutProps`, dan `RouteContext` adalah
      # tipe global yang DIBANGKITKAN Next ke .next/types — di checkout bersih
      # folder itu belum ada, dan tsc gagal dengan "Cannot find name
      # 'PageProps'". `typegen` membuatnya tanpa build penuh (~0,4 detik).
      - run: npx next typegen
      - run: npx tsc --noEmit
      # node:test hanya menyentuh lib murni (wilayah, bahasa, media, …).
      - run: npm test
      - run: npx prisma migrate deploy
      # --exit-code: 2 = DB hasil migrasi ≠ schema.prisma. Drift membuat
      # `migrate dev` berikutnya diam-diam menyusun DROP COLUMN di DB yang
      # dipakai bersama aplikasi Laravel. Perbaiki dengan migrasi baru (atau
      # deklarasikan kolom warisan), jangan dengan db push.
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:db
      # Hanya di PR: di main, build-web menjalankan build yang sama persis di
      # Dockerfile (--webpack), jadi di sini hanya akan jadi build kedua.
      - if: github.event_name == 'pull_request'
        run: npx next build --webpack
        env:
          # Tanpa DB, sama seperti build Docker — jangan prerender dari DB uji.
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci
          SESSION_SECRET: ci-only-secret
