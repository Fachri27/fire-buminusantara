name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# Antrikan, jangan dibatalkan — dua build/deploy boleh berurutan, tidak tumpang tindih.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Ulangi CI untuk push langsung ke main — commit yang menyingkir alur PR
  # tetap harus lolos uji sebelum membangun.
  ci:
    uses: ./.github/workflows/ci.yml

  build-web:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag image (latest + sha panjang + sha pendek)
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ultramenid/fire-buminusantara
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=sha
      - uses: docker/build-push-action@v6
        env:
          # Build record (*.dockerbuild) tidak dipakai siapa pun — jangan isi kuota artifact.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* dipanggang saat build → datang dari repository variables.
          build-args: |
            NEXT_PUBLIC_MEDIA_URL=${{ vars.NEXT_PUBLIC_MEDIA_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}

  deploy-prod:
    needs: build-web
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      role: prod
      tags: WEB_TAG=sha-${{ github.sha }}
