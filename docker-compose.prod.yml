# Stack produksi role "prod". Database (MariaDB milik CMS Laravel), MinIO, dan
# nginx berjalan di luar stack ini — image di bawah hanya aplikasi Next.js.
# Port cuma diikat ke 127.0.0.1: host nginx yang menghadap publik.
services:
  web:
    image: ghcr.io/ultramenid/fire-buminusantara:${WEB_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      # Jaringan bersama dengan MinIO/MariaDB (dibuat manual:
      # docker network create shared) — container saling memanggil dengan nama
      # layanan (http://minio:9000), tanpa lewat port host. Port 127.0.0.1
      # MinIO tidak bisa dijangkau dari container (host.docker.internal datang
      # lewat alamat bridge, bukan loopback).
      - shared
      - default
    healthcheck:
      # /id dipaksa dynamic → lolos hanya jika app hidup DAN database terjangkau.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/id').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Penyegar data tiap 30 menit lewat /api/cron/warm-asap: sebaran asap +
  # udara (CAMS) dan hotspot FIRMS ditulis ke Redis; rute publik hanya membaca
  # salinan itu. Sengaja tanpa `condition: service_healthy`: web yang tak
  # sehat akan menggagalkan `compose up` sebelum rollback remote-deploy.sh
  # sempat jalan. Secret lewat stdin (-K -), bukan argumen: tidak muncul di
  # `ps` host. Log (satu baris JSON hasil per putaran): docker compose logs cron.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on: [web]
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 60
        while :; do
          printf '[cron] '
          printf 'header = "Authorization: Bearer %s"\n' "$$CRON_SECRET" \
            | curl -sS -K - -X POST -m 600 -w ' [%{http_code} %{time_total}s]\n' http://web:3000/api/cron/warm-asap
          # 30 menit: FIRMS memperbarui berkasnya tiap 60 menit, CAMS dua run
          # sehari — 15 menit dulu sebagian besar mengunduh berkas yang sama.
          sleep 1800
        done

networks:
  shared:
    external: true