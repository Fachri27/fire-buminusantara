# nginx HOST untuk wss://live.nusantara.earth → LiveKit (127.0.0.1:7880).
# Pasang sekali di box (bukan bagian CI):
#   sudo cp deploy/livekit.nginx.conf /etc/nginx/sites-available/live.nusantara.earth
#   sudo ln -s /etc/nginx/sites-available/live.nusantara.earth /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d live.nusantara.earth   # menambah blok 443 + sertifikat
server {
    listen 80;
    server_name live.nusantara.earth;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        # Upgrade untuk WebSocket sinyal; keep-alive untuk API Twirp (RoomService).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Siaran bisa berjam-jam; bawaan 60 detik memutus sinyal yang sepi.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
